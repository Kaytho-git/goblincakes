<svg xmlns="http://www.w3.org/2000/svg" width="140" height="100" viewBox="0 0 140 100">
  <!-- Used by the dock (translucent mode). Invisible since 29 Oct: the GOBLINCAKES dock widget
       draws its own background and accent frame, just around the icons. The elements stay
       (fully transparent) so Plasma doesn't fall back to Breeze's panel.
       Everything not defined in this theme falls back to Breeze. -->
  <rect id="topleft" x="0" y="0" width="1" height="1" fill="#2A3852" fill-opacity="0"/>
  <rect id="top" x="1" y="0" width="98" height="1" fill="#2A3852" fill-opacity="0"/>
  <rect id="topright" x="99" y="0" width="1" height="1" fill="#2A3852" fill-opacity="0"/>
  <rect id="left" x="0" y="1" width="1" height="98" fill="#2A3852" fill-opacity="0"/>
  <rect id="right" x="99" y="1" width="1" height="98" fill="#2A3852" fill-opacity="0"/>
  <rect id="bottomleft" x="0" y="99" width="1" height="1" fill="#2A3852" fill-opacity="0"/>
  <rect id="bottom" x="1" y="99" width="98" height="1" fill="#2A3852" fill-opacity="0"/>
  <rect id="bottomright" x="99" y="99" width="1" height="1" fill="#2A3852" fill-opacity="0"/>
  <rect id="center" x="1" y="1" width="98" height="98" fill="#0B1018" fill-opacity="0"/>

  <!-- Inner padding -->
  <rect id="hint-top-margin" x="110" y="0" width="1" height="4" fill="none"/>
  <rect id="hint-bottom-margin" x="115" y="0" width="1" height="4" fill="none"/>
  <rect id="hint-left-margin" x="110" y="20" width="4" height="1" fill="none"/>
  <rect id="hint-right-margin" x="110" y="30" width="4" height="1" fill="none"/>
</svg>
