<svg xmlns="http://www.w3.org/2000/svg" width="140" height="100" viewBox="0 0 140 100">
  <!-- Square popup frame. Colours follow the active colour scheme (GoblinCakes). -->
  <!-- Everything not defined in this theme falls back to Breeze. -->
  <style type="text/css" id="current-color-scheme">
    .ColorScheme-Background { color: #0c0e14; }
    .ColorScheme-Text { color: #e6e9f0; }
  </style>

  <!-- 1px border -->
  <rect id="topleft" x="0" y="0" width="1" height="1" class="ColorScheme-Text" fill="currentColor" fill-opacity="0.15"/>
  <rect id="top" x="1" y="0" width="98" height="1" class="ColorScheme-Text" fill="currentColor" fill-opacity="0.15"/>
  <rect id="topright" x="99" y="0" width="1" height="1" class="ColorScheme-Text" fill="currentColor" fill-opacity="0.15"/>
  <rect id="left" x="0" y="1" width="1" height="98" class="ColorScheme-Text" fill="currentColor" fill-opacity="0.15"/>
  <rect id="right" x="99" y="1" width="1" height="98" class="ColorScheme-Text" fill="currentColor" fill-opacity="0.15"/>
  <rect id="bottomleft" x="0" y="99" width="1" height="1" class="ColorScheme-Text" fill="currentColor" fill-opacity="0.15"/>
  <rect id="bottom" x="1" y="99" width="98" height="1" class="ColorScheme-Text" fill="currentColor" fill-opacity="0.15"/>
  <rect id="bottomright" x="99" y="99" width="1" height="1" class="ColorScheme-Text" fill="currentColor" fill-opacity="0.15"/>

  <!-- Fill -->
  <rect id="center" x="1" y="1" width="98" height="98" class="ColorScheme-Background" fill="currentColor"/>

  <!-- Inner padding, same as Breeze -->
  <rect id="hint-top-margin" x="110" y="0" width="1" height="6" fill="none"/>
  <rect id="hint-bottom-margin" x="115" y="0" width="1" height="6" fill="none"/>
  <rect id="hint-left-margin" x="110" y="20" width="6" height="1" fill="none"/>
  <rect id="hint-right-margin" x="110" y="30" width="6" height="1" fill="none"/>
</svg>
