<svg xmlns="http://www.w3.org/2000/svg" width="140" height="100" viewBox="0 0 140 100">
  <!-- Square GOBLINCAKES frame. Everything not defined in this theme falls back to Breeze.
       Solid = the top bar (always opaque): white line along its bottom edge.
       The dock is translucent, so it uses ../../widgets/panel-background.svg. -->
  <rect id="topleft" x="0" y="0" width="1" height="1" fill="#2A3852"/>
  <rect id="top" x="1" y="0" width="98" height="1" fill="#2A3852"/>
  <rect id="topright" x="99" y="0" width="1" height="1" fill="#2A3852"/>
  <rect id="left" x="0" y="1" width="1" height="98" fill="#2A3852"/>
  <rect id="right" x="99" y="1" width="1" height="98" fill="#2A3852"/>
  <rect id="bottomleft" x="0" y="99" width="1" height="1" fill="#E6ECF5"/>
  <rect id="bottom" x="1" y="99" width="98" height="1" fill="#E6ECF5"/>
  <rect id="bottomright" x="99" y="99" width="1" height="1" fill="#E6ECF5"/>
  <rect id="center" x="1" y="1" width="98" height="98" fill="#0B1018"/>

  <!-- Inner padding -->
  <rect id="hint-top-margin" x="110" y="0" width="1" height="4" fill="none"/>
  <rect id="hint-bottom-margin" x="115" y="0" width="1" height="4" fill="none"/>
  <rect id="hint-left-margin" x="110" y="20" width="4" height="1" fill="none"/>
  <rect id="hint-right-margin" x="110" y="30" width="4" height="1" fill="none"/>
</svg>
