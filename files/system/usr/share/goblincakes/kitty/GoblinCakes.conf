# GOBLINCAKES terminal colours for Kitty – same as Ghostty's GoblinCakes theme
# (/usr/share/ghostty/themes/GoblinCakes) and Konsole's GoblinCakes.colorscheme.
# The cursor, links and the active tab follow the accent colour (goblincakes-accent.conf).
background #07090D
foreground #E6ECF5
cursor #2F6FED
cursor_text_color #07090D
selection_background #1E3A6B
selection_foreground #E6ECF5
url_color #6E9BFF

color0  #0E1420
color1  #E5484D
color2  #3DD68C
color3  #F5B83D
color4  #2F6FED
color5  #A78BFA
color6  #38BDF8
color7  #C9D3E3
color8  #3F5070
color9  #FF6B70
color10 #6BE3A8
color11 #FFD27A
color12 #6E9BFF
color13 #C4B5FD
color14 #7DD3FC
color15 #E6ECF5

# Flat with straight corners, like the rest of GOBLINCAKES (KDE draws the window frame)
tab_bar_style separator
tab_separator ""
tab_title_template " {title} "
tab_bar_background #0B1018
tab_bar_margin_color #0B1018
active_tab_background #2F6FED
active_tab_foreground #E6ECF5
active_tab_font_style normal
inactive_tab_background #0B1018
inactive_tab_foreground #8B98AD
inactive_tab_font_style normal
active_border_color #2F6FED
inactive_border_color #1E2A40
window_border_width 1px
wayland_titlebar_color background
# Updated by goblin update, not by Kitty's own check
update_check_interval 0
enable_audio_bell no
