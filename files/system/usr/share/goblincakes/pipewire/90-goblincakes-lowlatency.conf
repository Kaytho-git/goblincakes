# GOBLINCAKES Config → Inställningar → Ljud med låg fördröjning
# 256 samples at 48 kHz ≈ 5.3 ms (PipeWire's default is 1024 ≈ 21 ms).
# Music at 44.1 kHz plays without resampling.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 ]
    default.clock.quantum       = 256
    default.clock.min-quantum   = 64
}
