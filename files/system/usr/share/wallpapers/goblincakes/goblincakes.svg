<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 1920 1080">
  <!-- GOBLINCAKES desktop: Deep blue with the goblin logo in its own colours right of centre (placed as
       on the login screen), but puzzled: round eyes looking up, one eyebrow raised – "Ojdå! Progress?" -->
  <rect width="1920" height="1080" fill="#12203A"/>

  <g transform="translate(1060 280) scale(4)">
    <!-- Speech bubble, flat with straight corners like the rest of GOBLINCAKES -->
    <path d="M94 -16 H182 V10 H112 L102 22 L104 10 H94 Z" fill="none" stroke="#2F6FED" stroke-width="1.5" stroke-linejoin="miter"/>
    <text x="138" y="-0.5" text-anchor="middle" font-family="Chakra Petch" font-weight="700" font-size="9.5" letter-spacing="0.3" fill="#E6ECF5">Ojdå! Progress?</text>

    <!-- Head (top of the cupcake) -->
    <path d="M28 66 C22 58 16 48 10 38 C22 42 30 46 34 50 C38 34 48 24 60 24 C72 24 82 34 86 50 C90 46 98 42 110 38 C104 48 98 58 92 66 Z" fill="#E6ECF5"/>
    <!-- Eyebrows: the left one flat, the right one raised -->
    <path d="M42 39 L54 40" stroke="#07090D" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <path d="M66 36 Q72 31 79 35" stroke="#07090D" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <!-- Round eyes, pupils looking up at the question -->
    <circle cx="49" cy="48" r="5.5" fill="#07090D"/>
    <circle cx="72" cy="46" r="6.5" fill="#07090D"/>
    <circle cx="50.5" cy="46.2" r="1.9" fill="#E6ECF5"/>
    <circle cx="74" cy="43.8" r="2.2" fill="#E6ECF5"/>
    <!-- A small, unsure mouth -->
    <path d="M55 58 Q58 56 61 58 Q64 60 67 57.5" stroke="#07090D" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Cupcake wrapper -->
    <path d="M30 70 H90 L81 106 H39 Z" fill="#2F6FED"/>
    <path d="M49 73 L51 103 M60 73 V103 M71 73 L69 103" stroke="#07090D" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.45"/>
  </g>
</svg>
