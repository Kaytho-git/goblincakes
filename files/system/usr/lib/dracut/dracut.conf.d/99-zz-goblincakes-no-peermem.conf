# GOBLINCAKES (optimering P11a): nvidia_peermem kan bara laddas med särskild
# nätverkshårdvara (GPUDirect RDMA) och ger annars "could not insert
# 'nvidia_peermem': Invalid argument" vid varje start. Läses efter Nvidia-paketets
# 99-nvidia.conf (bokstavsordning) och tar bara bort den modulen ur listan –
# resten av listan (nvidia, nvidia_drm …) lämnas som Universal Blue har den.
force_drivers="${force_drivers//nvidia_peermem/}"
omit_drivers+=" nvidia_peermem "
