# GOBLINCAKES: Prestanda (power-profiles "performance") = Fedora's throughput-performance – a server profile
# that lets 40 % of the memory fill with unwritten data before it is written. On a hard disk that came in
# one big burst and everything else that needed the disk froze for seconds (4 Nov, the wife's laptop,
# 16 GB → ~6 GB). Same CPU settings, the write cache of latency-performance.
[main]
summary=GOBLINCAKES Prestanda: throughput-performance with a small write cache
include=throughput-performance

[vm]
dirty_bytes = 10%
dirty_background_bytes = 3%
