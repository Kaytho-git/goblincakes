# GOBLINCAKES' theme for Flathub's Chromium (the policy in /usr/share/goblincakes/chromium-policy):
# Chromium reads policies only from its extension point org.chromium.Chromium.Policy, so the
# folder is offered as an unmanaged extension of it. Chrome and Brave read /etc/opt/chrome
# and /etc/brave/policies on the host instead (their Flatpaks have host-etc).
d /var/lib/flatpak/extension 0755 root root -
d /var/lib/flatpak/extension/org.chromium.Chromium.Policy.goblincakes 0755 root root -
d /var/lib/flatpak/extension/org.chromium.Chromium.Policy.goblincakes/x86_64 0755 root root -
L /var/lib/flatpak/extension/org.chromium.Chromium.Policy.goblincakes/x86_64/1 - - - - /usr/share/goblincakes/chromium-policy
