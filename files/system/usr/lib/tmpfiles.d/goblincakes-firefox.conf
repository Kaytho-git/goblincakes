# GOBLINCAKES settings for Firefox (/usr/share/goblincakes/firefox): middle-click autoscroll
# as on Windows ("default" = the user can still change it in Firefox's settings).
# Flathub's Firefox reads them through its extension point org.mozilla.firefox.systemconfig
# (shown as /app/etc/firefox inside the Flatpak), Fedora's RPM from /etc/firefox.
d /var/lib/flatpak/extension 0755 root root -
d /var/lib/flatpak/extension/org.mozilla.firefox.systemconfig 0755 root root -
d /var/lib/flatpak/extension/org.mozilla.firefox.systemconfig/x86_64 0755 root root -
L /var/lib/flatpak/extension/org.mozilla.firefox.systemconfig/x86_64/stable - - - - /usr/share/goblincakes/firefox
d /etc/firefox/policies 0755 root root -
L /etc/firefox/policies/policies.json - - - - /usr/share/goblincakes/firefox/policies/policies.json
