# GOBLINCAKES: Fedora rebuilds this at every start-up (about a minute on a hard disk, during the login) –
# only after the image changed, and then with the lowest disk and CPU priority (4 Nov)
[Service]
Nice=19
IOSchedulingClass=idle
ExecCondition=/usr/libexec/goblincakes-idle-jobs changed appstream-cache-refresh
ExecStartPost=/usr/libexec/goblincakes-idle-jobs done appstream-cache-refresh
