# GOBLINCAKES: Flatpak's update gives way to the user – lowest disk and CPU priority (BFQ honours the idle
# class), and flatpak repair (reads every file: minutes on a hard disk) at most once a week instead of every
# run (4 Nov, the wife's laptop: 4.5 min of a busy disk right after login)
[Service]
Nice=19
IOSchedulingClass=idle
ExecStart=
ExecStart=/usr/bin/flatpak --system uninstall --unused -y --noninteractive ; /usr/bin/flatpak --system update -y --noninteractive ; /usr/libexec/goblincakes-idle-jobs repair --system
