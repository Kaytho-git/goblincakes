# GOBLINCAKES: not 2 minutes after start-up, when the user logs in (Persistent also ran a missed 04:00
# right at boot) – 20 minutes after, or at 04:00 if the computer is on. An empty OnBootSec= resets every
# trigger, so OnCalendar is given again.
[Timer]
OnBootSec=
OnBootSec=20min
OnCalendar=*-*-* 4:00:00
Persistent=false
