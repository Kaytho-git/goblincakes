# Powerdevil frågar skärmarna över kabeln (DDC/CI) när de stängs av och vaknar.
# Med Nvidia fastnade bilden då (21 okt: skärmarna vaknade inte, Nvidia
# "Lost display notification"). Utan DDC kan KDE inte ändra skärmarnas
# ljusstyrka – ddcutil i terminalen fungerar som förut.
[Service]
Environment=POWERDEVIL_NO_DDCUTIL=1
