# GOBLINCAKES: Steam at login waits for its game libraries on other disks (they are mounted by
# goblincakes-automount at the same moment) – see /usr/libexec/goblincakes-steam-wait-libraries.
[Service]
# "-": Steam starts even if the wait itself fails
ExecStartPre=-/usr/libexec/goblincakes-steam-wait-libraries
TimeoutStartSec=60
