# GOBLINCAKES: wifi always at full power – no power saving between packets.
# With it on, Intel cards (iwlwifi) and others doze off and the connection gets short
# stalls and lag (3 Nov: the Lenovo Y520's Intel 8265 had "Power save: on").
# 2 = off. A connection with its own powersave setting still wins over this.
[connection]
wifi.powersave = 2
