# GOBLINCAKES login screen (SDDM, used instead of Plasma Login Manager)
# 99- so it is read after, and wins over, Fedora's own settings
[Theme]
Current=goblincakes
CursorTheme=Breeze_Light
Font=IBM Plex Sans

[General]
# Num Lock on at the login screen
Numlock=on
# A new user (no last session yet) gets the desktop, never GOBLINCAKES TV
DefaultSession=plasma.desktop
