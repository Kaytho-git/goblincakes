# GOBLINCAKES: performance → goblincakes-performance (throughput-performance with a small write cache – usr/lib/tuned/profiles/goblincakes-performance)
[main]
# The default PPD profile
default=balanced
battery_detection=true
sysfs_acpi_monitor=true

[profiles]
# PPD = TuneD
power-saver=powersave
balanced=balanced
performance=goblincakes-performance

[battery]
# PPD = TuneD
balanced=balanced-battery
