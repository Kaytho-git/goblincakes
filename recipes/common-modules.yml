# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Everything both GOBLINCAKES variants have (recipe.yml = AMD/Intel, recipe-nvidia.yml = Nvidia).
modules:
  # Copies everything in files/system/ into the image root
  - type: files
    files:
      - source: system
        destination: /

  # Layered RPM packages
  - type: dnf
    repos:
      cleanup: true
      copr:
        - bieszczaders/kernel-cachyos-addons # ananicy-cpp + rules
        - mineiro/ghostty                    # Ghostty terminal
    install:
      packages:
        - ghostty               # default terminal
        - fastfetch             # system info with the GOBLINCAKES logo
        - plymouth-plugin-script # engine for the GOBLINCAKES boot screen
        - sddm                  # login manager with the GOBLINCAKES theme
        - sddm-wayland-plasma   # runs the SDDM login screen on Wayland (KWin)
        - python3-pyside6       # GOBLINCAKES Config window (Qt for Python)
        - fuse-libs             # lets AppImages run (WowUp, Raider.IO, Archon)
        - aurorae               # engine for the GOBLINCAKES window frames
        - kvantum               # engine for the GOBLINCAKES widget theme
        - libratbag-ratbagd     # backend for Piper (G502 Hero)
        - ddcutil               # monitor brightness over DDC/CI
        - pipewire-utils        # pw-record: goblin graph listens to what the speakers play
        - gh                    # GitHub CLI: log in and push to GitHub (Claude Code, own projects)
        - skopeo                # reads the newest GOBLINCAKES image's Fedora version (goblincakes-fedora-check)
        - gamemode              # performance mode while gaming
        - gamescope             # Valve's game compositor (gamescope -- spel), also the TV mode
        - mangohud              # FPS meter in games (GOBLINCAKES Config → Inställningar)
        - switcheroo-control    # laptops with two graphics cards: "Kör med dedikerat grafikkort"
        - ananicy-cpp           # keeps the desktop responsive under load
        - cachyos-ananicy-rules

  # Ghostty also opens in VirtualBox/VMware with 3D on (software OpenGL there only)
  - type: script
    scripts:
      - ghostty-wrapper.sh

  # Steam (RPM Fusion), with its 32-bit libraries – in the image so TV mode, disks,
  # MangoHud and Gamescope work without Flatpak workarounds
  - type: script
    scripts:
      - install-steam.sh

  # Xbox controllers: xone (wireless dongle, USB) and xpadneo (Bluetooth: rumble, right buttons),
  # pre-built by Universal Blue for exactly this kernel and signed with their key (Secure Boot:
  # Grafik tab). Never stops the build if they aren't ready for a new kernel yet.
  - type: script
    scripts:
      - install-xbox-kmods.sh

  # MangoHud's settings window, if Fedora has it
  - type: script
    scripts:
      - install-goverlay.sh

  # AppGrid (app grid in the middle of the screen) from its COPR package – brings the
  # dependencies, and is the fallback if our own build below failed. Doesn't stop the
  # build by itself (a new Plasma the COPR hasn't been rebuilt for yet)
  - type: script
    scripts:
      - install-appgrid.sh

  # AppGrid with square corners, built in the appgrid-square stage above,
  # replaces the COPR package's files (only a marker if that build failed)
  - type: copy
    from: appgrid-square
    src: /out/
    dest: /

  # Stops the build if the image ended up without an AppGrid that loads
  - type: script
    scripts:
      - check-appgrid.sh

  # Newer ratbagd + mouse list for Piper, built in the libratbag-git stage above,
  # over Fedora's libratbag-ratbagd package (G502 X Plus / G502 X Wireless)
  - type: copy
    from: libratbag-git
    src: /out/
    dest: /

  # Fedora programs GOBLINCAKES replaces (Konsole, Discover, Welcome …) out of AppGrid –
  # still installed; "goblin apps" lists them and shows one again
  - type: script
    scripts:
      - hide-apps.sh
      - remove-extras.sh    # Asian input methods out (a smaller image)
      - ananicy-tweaks.sh   # Steam's shader processing not starved by ananicy-cpp

  # Log in through SDDM (GOBLINCAKES theme) instead of Plasma Login Manager
  - type: script
    snippets:
      - "ln -sf /usr/lib/systemd/system/sddm.service /etc/systemd/system/display-manager.service"

  # scx_lavd game scheduler for the Optimering tab, if it can be found (off until switched on there)
  - type: script
    scripts:
      - install-scx.sh

  # GOBLINCAKES lock screen + logout screen over Plasma's shell package – after every
  # module that installs RPMs, so a Plasma update during the build can't overwrite them
  - type: script
    scripts:
      - plasma-shell-overrides.sh

  # Qt for Python must load (Fedora rebuilds it for every new Qt) – otherwise GOBLINCAKES
  # Config, Goblin AI, GoblinRecorder and goblin graph wouldn't start; stop the build instead
  - type: script
    snippets:
      - "python3 -c 'from PySide6 import QtCore, QtGui, QtWidgets, QtQml, QtQuick, QtDBus, QtNetwork; print(\"PySide6\", QtCore.qVersion())'"

  # GOBLINCAKES typefaces (downloaded from Google Fonts at build time)
  - type: fonts
    fonts:
      google-fonts:
        - Chakra Petch    # headings, splash, logout
        - IBM Plex Sans   # interface and body text
        - IBM Plex Mono   # Ghostty terminal

  # Always-installed Flatpaks – kept to a minimum on purpose: everything else
  # (Discord, Lutris, VLC …) is picked in GOBLINCAKES Config; Steam is in the image
  # (validated against Flathub at build time)
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: true
        install:
          - org.mozilla.firefox
          - org.freedesktop.Piper   # mouse configurator
          - org.chromium.Chromium   # for VIA / Keychron Launcher (WebHID)

  - type: systemd
    system:
      enabled:
        - ratbagd.service
        - ananicy-cpp.service
        - switcheroo-control.service      # tells KDE about a second graphics card
        - goblincakes-variant-sync.service # after the ISO install: fetch the Nvidia variant if chosen
    user:
      enabled:
        - goblincakes-updates.timer       # the green update arrow in the top bar
        - goblincakes-disk-owner.path     # own Linux-formatted disks mounted later (otherwise root's)
        - goblincakes-frames.path         # goblin frames: a notification when a measured game closes
        - goblincakes-recorder.service    # GoblinRecorder – only runs for those who chose it in Config
        - goblincakes-graph.service       # goblin graph opens when music plays – only with goblin graph auto on
        - goblincakes-season.timer        # the desktop's look by date (login + midnight)
        - goblincakes-ollama.service      # lokal AI – only runs for those who installed it in Goblin AI

  # GOBLINCAKES name in About this System and the boot menu
  - type: os-release
    properties:
      NAME: GOBLINCAKES
      PRETTY_NAME: GOBLINCAKES
      # Computer name when none is set (user@goblincakes in the terminal)
      DEFAULT_HOSTNAME: goblincakes

  # Rebuild the initramfs so the GOBLINCAKES boot screen (Plymouth) is used.
  # Keep this near the end: it picks up everything done before it.
  - type: initramfs

  - type: signing

  # Trust both GOBLINCAKES variants (goblincakes and goblincakes-nvidia), so the
  # Grafik tab in GOBLINCAKES Config can switch between them; marks which one this is
  - type: script
    scripts:
      - variants.sh
