# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# GOBLINCAKES, the variant on the install ISO: starts on every computer.
# AMD and Intel get their full drivers (Mesa); Nvidia starts with the open driver
# until "Installera Nvidia-drivrutiner" in GOBLINCAKES Config (Grafik) switches
# to goblincakes-nvidia (recipe-nvidia.yml). Shared content: common-*.yml.
name: goblincakes
description: GOBLINCAKES - Fedora Kinoite for AMD and Intel graphics, gaming, WoW and Ianseo tools

base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest

stages:
  - from-file: common-stages.yml

modules:
  - from-file: common-modules.yml
