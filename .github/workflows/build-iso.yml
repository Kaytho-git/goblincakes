# GOBLINCAKES installation ISO (live USB), built when you ask for it:
# GitHub → Actions → "Bygg installations-ISO" → Run workflow.
# The ISO is a build file (artifact) on that run's page for one day; each new build
# first deletes the earlier ISOs, so there is never more than one.
# It is also published as the release "iso" in parts under 2 GB plus goblincakes-iso.json
# (public, no login) – that is where the GOBLINCAKES USB creator downloads it from.
name: Bygg installations-ISO
on:
  workflow_dispatch:

concurrency:
  group: build-iso
  cancel-in-progress: true

permissions:
  contents: write # the "iso" release for the USB creator
  actions: write # delete earlier ISO build files
  packages: read

jobs:
  iso:
    name: Bygg ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Ta bort tidigare ISO:er
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, name: "goblincakes-iso", per_page: 100,
            });
            for (const artifact of artifacts) {
              core.info(`Tar bort ${artifact.name} (${artifact.id}) från ${artifact.created_at}`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner, repo: context.repo.repo, artifact_id: artifact.id,
              });
            }

      - name: Gör plats på byggmaskinen
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Lägg containerbyggena på den stora disken (/mnt)
        run: |
          sudo mkdir -p /mnt/containers /var/lib/containers
          sudo mount --bind /mnt/containers /var/lib/containers
          df -h / /mnt

      - uses: actions/checkout@v4

      - name: Bygg live-systemet
        run: |
          sudo podman build --pull=always --cap-add sys_admin --security-opt label=disable --squash \
            --build-arg BASE_IMAGE=ghcr.io/kaytho-git/goblincakes:latest \
            -t localhost/goblincakes-live:latest iso
          df -h / /mnt

      # Universal Blue's Titanoboa makes the ISO. Run its script directly (pinned commit):
      # the action's own wrapper fails moving the finished ISO to a folder of our choice.
      - name: Gör ISO:n
        env:
          TITANOBOA_REF: 5c457c3d0518bd17e754be0fd98a60d29d26abb4
        run: |
          git clone --quiet https://github.com/ublue-os/titanoboa /tmp/titanoboa
          git -C /tmp/titanoboa checkout --quiet "$TITANOBOA_REF"
          mkdir -p output
          iso=$(TITANOBOA_OUTPUT_DIR="$GITHUB_WORKSPACE/output" /tmp/titanoboa/main.sh localhost/goblincakes-live:latest)
          sudo chown "$(id -u):$(id -g)" output/*.iso
          [ -f "$iso" ] && [ "$(basename "$iso")" = GOBLINCAKES.iso ]

      - name: Namn och kontrollsumma
        run: |
          version=$(date -u +%Y.%m.%d)
          cd output
          mv GOBLINCAKES.iso "GOBLINCAKES-$version.iso"
          sha256sum "GOBLINCAKES-$version.iso" | tee "GOBLINCAKES-$version.iso.sha256"
          ls -lh
          sudo podman rmi -f localhost/goblincakes-live:latest || true

      # First the build file, so the ISO is there even if the release step fails
      - name: Lägg upp ISO:n (finns i ett dygn)
        uses: actions/upload-artifact@v4
        with:
          name: goblincakes-iso
          path: output/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      # The USB creator downloads from here: the release "iso", replaced by every build
      - name: Lägg upp ISO:n som release (för USB-skaparen)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          iso=$(ls output/GOBLINCAKES-*.iso)
          version=$(basename "$iso" .iso); version=${version#GOBLINCAKES-}
          sudo mkdir -p /mnt/iso-release && sudo chown "$(id -u):$(id -g)" /mnt/iso-release
          GOBLINCAKES_VERSION="$version" python3 iso/release.py "$iso" /mnt/iso-release live-base \
            "Prova och installera" "Startar GOBLINCAKES från USB-minnet: prova datorn, rensa diskar och installera. Installerar utan internet."
          gh release delete iso --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          # Create the release first, then upload the parts (creating it together with files
          # makes gh start with a draft release, which GitHub refused with 403 on 9 Oct)
          gh release create iso -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "GOBLINCAKES ISO $version" \
            --notes "Installations-ISO för GOBLINCAKES, i delar under 2 GB. Enklast: använd GOBLINCAKES USB-skaparen – den hämtar, sätter ihop, kontrollerar och skriver till USB-minnet. För hand: ladda ner alla delar, sätt ihop dem i ordning (Linux: cat GOBLINCAKES-*.iso.part* > GOBLINCAKES.iso, Windows: copy /b del00+del01+… GOBLINCAKES.iso) och jämför sha256 med goblincakes-iso.json."
          gh release upload iso -R "$GITHUB_REPOSITORY" --clobber /mnt/iso-release/*
          sudo rm -rf /mnt/iso-release
