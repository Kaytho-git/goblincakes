# GOBLINCAKES installation ISO (live USB), built when you ask for it:
# GitHub → Actions → "Bygg installations-ISO" → Run workflow.
# The ISO is a build file (artifact) on that run's page for one day; each new build
# first deletes the earlier ISOs, so there is never more than one.
name: Bygg installations-ISO
on:
  workflow_dispatch:

concurrency:
  group: build-iso
  cancel-in-progress: true

permissions:
  contents: read
  actions: write # delete earlier ISO build files
  packages: read

jobs:
  iso:
    name: Bygg ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Ta bort tidigare ISO:er
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, name: "goblincakes-iso", per_page: 100,
            });
            for (const artifact of artifacts) {
              core.info(`Tar bort ${artifact.name} (${artifact.id}) från ${artifact.created_at}`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner, repo: context.repo.repo, artifact_id: artifact.id,
              });
            }

      - name: Gör plats på byggmaskinen
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Lägg containerbyggena på den stora disken (/mnt)
        run: |
          sudo mkdir -p /mnt/containers /var/lib/containers
          sudo mount --bind /mnt/containers /var/lib/containers
          df -h / /mnt

      - uses: actions/checkout@v4

      - name: Bygg live-systemet
        run: |
          sudo podman build --pull=always --cap-add sys_admin --security-opt label=disable --squash \
            --build-arg BASE_IMAGE=ghcr.io/kaytho-git/goblincakes:latest \
            -t localhost/goblincakes-live:latest iso
          df -h / /mnt

      # Titanoboa needs the folder the ISO goes into to exist already
      - name: Mapp för ISO:n
        run: mkdir -p output

      - name: Gör ISO:n
        id: iso
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4
        with:
          image-ref: localhost/goblincakes-live:latest
          iso-dest: ${{ github.workspace }}/output/GOBLINCAKES.iso

      - name: Namn och kontrollsumma
        run: |
          version=$(date -u +%Y.%m.%d)
          cd output
          mv GOBLINCAKES.iso "GOBLINCAKES-$version.iso"
          sha256sum "GOBLINCAKES-$version.iso" | tee "GOBLINCAKES-$version.iso.sha256"
          ls -lh
          sudo podman rmi -f localhost/goblincakes-live:latest || true

      - name: Lägg upp ISO:n (finns i ett dygn)
        uses: actions/upload-artifact@v4
        with:
          name: goblincakes-iso
          path: output/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
