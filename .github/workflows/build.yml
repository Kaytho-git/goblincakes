name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    paths-ignore: # don't rebuild if only documentation or the ISO build has changed
      - "**.md"
      - "docs/**"
      - "iso/**"
      - ".github/workflows/build-iso.yml"
      - "firefox-tema/**" # the Firefox theme is signed and published by build-firefox-theme.yml
      - ".github/workflows/build-firefox-theme.yml"
      - "chrome-tema/**" # the Chrome/Brave theme is packed and published by build-chrome-theme.yml
      - ".github/workflows/build-chrome-theme.yml"
      - "usb-skaparen/**"
      - ".github/workflows/build-usb-creator.yml"
      - "tools/**" # the checks and generators run here and before a commit; their output is in files/ (P14.4)
      - ".claude/**"
      - "LICENSE"
      - ".github/dependabot.yml"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  # P15 (docs/optimering/granskning.md, 11 Nov): syntax, QML, the copies – a typo stops here, before
  # an image is built and staged on the computers. Warnings (versions to bump) never stop anything.
  check:
    name: Kontroll före bygget
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the warnings compare with the previous push
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14" # as new as the images' Python, so new syntax isn't called an error
      # Without PySide6 the QML check is skipped with a warning (a PyPI hiccup must not stop the build)
      - name: PySide6 för QML-kollen
        continue-on-error: true
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0
          python -m pip install -q "PySide6>=6.11,<6.12"
      - name: Kontrollen (tools/check.py)
        env:
          BEFORE: ${{ github.event.before }}
        run: python tools/check.py "${BEFORE:-HEAD~1}"

  bluebuild:
    name: Build Custom Image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        # chunkah (P12 in docs/optimering/granskning.md, 11 Nov): splits the finished image into
        # layers by content (package by package, like Universal Blue's own images), so unchanged
        # packages keep their layer between builds and an update only downloads what changed
        # (without it every build renamed all ~29 of our layers: 1.4 GB per update, 2.9 GB for
        # legacy). Tried on the base variant first (nobody runs it daily): 12 Nov 2.07 → 0.55 GB per
        # update (M12); legacy 12 Nov 2.12 → 0.75 GB. Nvidia 12 Nov, after the ISO build worked with
        # the base variant's chunkah image. All three now have it.
        include:
          - recipe: recipe.yml        # goblincakes (AMD/Intel, on the ISO)
            chunkah: "true"
          - recipe: recipe-nvidia.yml # goblincakes-nvidia (switched to in GOBLINCAKES Config)
            chunkah: "true"
          - recipe: recipe-nvidia-legacy.yml # goblincakes-nvidia-legacy (GTX 900/10, Nvidia's 580 driver; switched to in Config)
            chunkah: "true"
    steps:
      # The repo with its whole history (7 Nov): the news lines get the commit they came from
      # (tools/news-commits.py → nyheter-commits.json, shown by goblin update). The action's own
      # checkout is skipped below, so this copy – with the file – is the one that is built.
      - name: Hämta repot (hela historiken)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Never stops the build: without the file goblin update just shows no commits
      - name: Nyheternas commits
        continue-on-error: true
        run: python3 tools/news-commits.py

      # BuildKit (the builder the action sets up) comes from Docker Hub, whose login timed out from
      # GitHub's machines for a whole evening (9 Oct). Fetched first from Google's Docker Hub mirror
      # under the same name, so Docker doesn't need Docker Hub for it; if the mirror fails too,
      # the action fetches it from Docker Hub as before.
      - name: BuildKit from Google's Docker Hub mirror
        continue-on-error: true
        run: |
          docker pull mirror.gcr.io/moby/buildkit:buildx-stable-1 &&
            docker tag mirror.gcr.io/moby/buildkit:buildx-stable-1 moby/buildkit:buildx-stable-1

      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@v1.13
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          skip_checkout: "true" # checked out above, with the news commits
          chunkah: ${{ matrix.chunkah }} # see the matrix above

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true
